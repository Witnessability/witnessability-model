  - execution evidence
  - provenance
  - attestations
  - observability
  - software supply chain
  - runtime verification
  - execution ownership
  - agent runtimes
  - AI governance
  - auditability
  - operational risk
  - independent verification
  - software execution

# Expected properties of a correct build. QA gates assert these against the produced PDF.
expected_build:
  page_size: "A4"
  pages_min: 20
  pages_max: 40
  fonts_all_embedded: true
  # The imported baseline was produced by xelatex/xdvipdfmx. Recorded as observed fact, not as a
  # target: the pinned toolchain declares its own engine in tooling/toolchain.lock.json.
  baseline_producer: "xdvipdfmx (0.1)"
  baseline_creator: "LaTeX with hyperref"

# Document-level PDF metadata the build is expected to set. The imported WM 1.1 baseline sets NONE
# of these; WM 1.0 did set them. The regression is fixed in the current publication candidate.
expected_pdf_metadata:
  title: "Toward a Witnessability Model for AI and Software Execution Systems"
  author: "Mikhail A. Sergeev and Vladimir Ikher"
  subject: "AI agents; execution evidence; runtime assurance; AI governance; witnessability; software assurance"
  keywords: "witnessability, AI agents, execution evidence, provenance, attestations, runtime verification"

