# Paper metadata — single source of truth for identity fields.
# Consumed by build and QA gates. Any mismatch between this file and the built PDF is a QA failure.

paper:
  title: "Toward a Witnessability Model for AI and Software Execution Systems"
  subtitle: "A Boundary-Based Framework for Classifying Execution Evidence"
  short_title: "Witnessability Model"

model:
  name: "Witnessability Model"
  version: "1.1"
  line: "1.0"
  scope_note: >-
    Version 1.1 is a bridge revision inside the 1.0 line. The WL vocabulary and the Boundary
    Ceiling are retained. A typed reformulation replacing the scalar vocabulary is reserved for
    version 2.0.

paper_revision:
  id: "1.1"
  date_statement: "Version 1.1 (bridge revision of the 1.0 line) --- Draft, July 2026"
  status: "DRAFT"
  released: false

# Canonical publication display form for WM 1.1. Applied to PDF metadata, release metadata, and
# SSRN/Zenodo preparation. Identity continuity with earlier artifacts is established by ORCID,
# never by string equality of display names.
authors:
  - name: "Mikhail A. Sergeev"
    affiliation: "Independent Researcher"
    orcid: "0009-0001-6443-855X"
    order: 1
    historical_name_variation: "Mikhail Anatolievich Sergeev"
  - name: "Vladimir Ikher"
    affiliation: "Independent Researcher"
    orcid: "0009-0000-0084-704X"
    order: 2

# Display-name variation across published artifacts. Recorded, not normalized: WM 1.0 is published
# and its metadata is not rewritten to match a later decision.
name_variation_record:
  - artifact: "WM 1.0 (SSRN abstract 6994720 / Zenodo 21824436)"
    pdf_metadata_author: "Mikhail Anatolievich Sergeev and Vladimir Ikher"
    zenodo_creator: "Sergeev, Mikhail A."
    action: "NOT MODIFIED — historical publication-name variation"
  - artifact: "WM 1.1 (RC001 onward)"
    pdf_metadata_author: "Mikhail A. Sergeev and Vladimir Ikher"
    action: "canonical form applied"
  - note: >-
      The two forms denote the same person. Continuity is established by ORCID
      0009-0001-6443-855X, which is identical across both artifacts and both venues. No consumer
      should infer distinct authorship from the differing display strings.

keywords:
