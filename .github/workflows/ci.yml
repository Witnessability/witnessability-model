name: CI

# Build and gate every change. This workflow publishes nothing, tags nothing, and holds no
# credential. It is safe to run on any branch and on any pull request.

on:
  push:
    branches-ignore: []
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: build + QA gates (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required, not a convenience: SOURCE_DATE_EPOCH is the commit time of
          # the last commit touching paper/, and in a shallow clone that history is not present —
          # git then reports the checkout commit instead, silently changing the PDF timestamp.
          fetch-depth: 0

      - name: Resolve jobname from the toolchain lock
        run: |
          echo "JOBNAME=$(python3 -c "import json;print(json.load(open('tooling/toolchain.lock.json'))['jobname'])")" >> "$GITHUB_ENV"

      - name: Secret scan
        run: ./scripts/scan-secrets.sh

      - name: Verify published baselines are unmodified
        run: ./scripts/verify-baselines.sh

      - name: metadata.yaml parses to the expected shape
        run: python3 scripts/metayaml.py paper/witnessability-model/metadata.yaml > /dev/null

      - name: Bibliography gates
        run: python3 scripts/qa-references.py --json-out refs-report.json

      # Runs on the source, so it gates a semantic regression before a build is even attempted.
      - name: Semantic invariant gates (NO-STRUCK-REDUCTIO and friends)
        run: |
          mkdir -p build
          python3 scripts/qa-semantic.py --json-out build/QA-SEMANTIC.json

      # The toolchain is built from this repository's Dockerfile, pinned to a base image digest.
      # No ambient TeX is used, on a runner or anywhere else.
      - name: Build pinned toolchain image
        run: docker build --platform linux/amd64 -t wm-tex:local-amd64 -f tooling/Dockerfile tooling/

      - name: Build paper
        env:
          BUILD_PLATFORM: linux/amd64
        run: ./scripts/build-paper.sh

      # Gates run inside the pinned image, not against the runner's poppler: the extraction
      # findings depend on the extractor's handling of unmapped glyphs, so its version is pinned
      # exactly like the TeX engine.
      - name: PDF + text-extraction gates
        env:
          BUILD_PLATFORM: linux/amd64
        run: |
          ./scripts/qa-run.sh \
            --pdf build/${JOBNAME}.pdf \
            --log build/${JOBNAME}.latex.log \
            --json-out build/QA-REPORT.json

      - name: Reproducibility — rebuild and compare byte for byte
        env:
          BUILD_PLATFORM: linux/amd64
        run: |
          cp build/${JOBNAME}.pdf /tmp/first.pdf
          echo "amd64 digest: $(sha256sum build/${JOBNAME}.pdf | cut -d' ' -f1)"
          echo "SOURCE_DATE_EPOCH used: $(git log -1 --format=%ct -- paper/)"
          ./scripts/build-paper.sh
          if cmp -s /tmp/first.pdf build/${JOBNAME}.pdf; then
            echo "same-environment reproducibility: BYTE-IDENTICAL"
          else
            echo "::warning::two builds in the same environment produced different bytes"
            echo "first : $(sha256sum /tmp/first.pdf)"
            echo "second: $(sha256sum build/${JOBNAME}.pdf)"
            exit 1
          fi

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-${{ github.sha }}
          path: |
            build/${{ env.JOBNAME }}.pdf
            build/BUILD-MANIFEST.json
            build/QA-REPORT.json
            build/QA-BASELINE.json
            build/build.log
            build/${{ env.JOBNAME }}.latex.log
            refs-report.json
          if-no-files-found: warn
          retention-days: 30
